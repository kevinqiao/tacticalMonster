<body style="overflow:hidden;width:100vw;height:100vh;margin:0;background-color:#3a6f63;background-image:linear-gradient(165deg,#5a8f9a 0%,#3a6f63 38%,#2a5248 100%);">

  <!-- 纯 HTML 静态层：首帧即显示可辨识的暗青绿渐变 + 背景图请求，不依赖 JS -->
  <div id="static-boot-cover" role="status" aria-live="polite" aria-busy="true"
    style="position:fixed;inset:0;z-index:2147483646;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;box-sizing:border-box;text-align:center;background-color:#3a6f63;background-image:url('/assets/portal/solitaire/backgrounds/bg-16x9.png'),linear-gradient(165deg,#5a8f9a 0%,#3a6f63 38%,#2a5248 100%);background-size:cover;background-position:center;background-repeat:no-repeat;color:#f4ebdd;font-family:'Fredoka','Segoe UI Rounded','Nunito',sans-serif;">
    <div class="boot-loading-spinner"
      style="width:44px;height:44px;border:4px solid rgba(244,235,221,0.15);border-top:4px solid #f4ebdd;border-radius:50%;margin-bottom:12px;display:inline-block;box-sizing:border-box;"></div>
    <span class="boot-loading-primary"
      style="font-size:24px;font-weight:700;color:#f4ebdd;line-height:1.4;margin-top:8px;display:inline-block;">正在进入游戏大厅…</span>
    <span class="boot-loading-secondary"
      style="font-size:15px;font-weight:600;color:#e8f4fc;opacity:0.8;line-height:1.4;display:inline-block;">Entering game lobby…</span>
  </div>
  <div id="root" style="overflow:hidden;width:100%;height:100%;min-height:100vh;background-color:transparent;"></div>
  <!-- 与 #root 同级：不被 React createRoot 清空；覆盖「HTML 可见～bundle 执行～BootLoadingOverlay」间隙。纯 HTML 文案，慢网下避免长时间纯黑无提示 -->
  <!-- 智能背景预加载：在慢网下，先显示精致的渐变底色，图片下载完成后平滑淡入，防止图片突兀“弹出” -->
  <script>
    (function() {
      var isPortrait = window.innerHeight > window.innerWidth;
      var bgUrl = isPortrait ? "/assets/portal/portal_bg_9x16.png" : "/assets/portal/solitaire/backgrounds/bg-16x9.png";
      var img = new Image();
      img.onload = function() {
        window.__BOOT_BG_LOADED__ = true;
        var cover = document.getElementById("static-boot-cover");
        if (cover) {
          cover.classList.add("bg-loaded");
        }
        try {
          window.dispatchEvent(new CustomEvent("boot-bg-loaded"));
        } catch(e) {}
      };
      img.src = bgUrl;
      // 如果图片已经缓存，可能在 onload 绑定前就加载完了，安全起见检查一下 complete
      if (img.complete) {
        window.__BOOT_BG_LOADED__ = true;
        try {
          window.dispatchEvent(new CustomEvent("boot-bg-loaded"));
        } catch(e) {}
      }
    })();
  </script>
  <!-- 放在 body 末尾：避免阻塞 head 解析，否则 body 黑底与 static-boot-cover 会晚于长脚本执行才出现 -->
  <script>
    (function () {
      'use strict';
      // 不覆盖 console.*：避免日志调用点被固定到本脚本行号。
      var SOURCE_MARKERS = [
        'chrome-extension://',
        'moz-extension://',
        'safari-web-extension://',
        'solanaActionsContentScript',
        'inpage.js',
        'contentScript',
        'injected'
      ];
      var MESSAGE_MARKERS = [
        'Failed to connect to MetaMask',
        'Failed to connect',
        'Something went wrong',
        'extension not found',
        'MetaMask',
        'wallet',
        'solana'
      ];

      function containsAny(text, markers) {
        if (!text) return false;
        for (var i = 0; i < markers.length; i++) {
          if (text.indexOf(markers[i]) !== -1) return true;
        }
        return false;
      }

      function isExtensionError(source, message, error) {
        var sourceStr = String(source || '');
        var messageStr = String(message || '');
        var stackStr = String((error && error.stack) || '');
        var nameStr = String((error && error.name) || '');
        var errorMsgStr = String((error && error.message) || '');
        var allText = sourceStr + ' ' + stackStr + ' ' + messageStr + ' ' + errorMsgStr + ' ' + nameStr;
        return containsAny(allText, SOURCE_MARKERS) || containsAny(allText, MESSAGE_MARKERS);
      }

      function reportBootError(title, detail) {
        try {
          if (document.getElementById('__html-boot-error__')) return;
          var box = document.createElement('div');
          box.id = '__html-boot-error__';
          box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:2147483647;background:#1a1a1a;color:#fff;padding:10px 12px;border:1px solid rgba(255,255,255,.2);font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:45vh;overflow:auto';
          box.textContent = String(title || 'Script error') + '\n' + String(detail || '');
          document.body.appendChild(box);
        } catch (_e) { }
      }
      window.__reportBootError = reportBootError;

      var originalErrorHandler = window.onerror;
      window.onerror = function (message, source, lineno, colno, error) {
        if (isExtensionError(source, message, error)) return true;
        reportBootError('window.onerror', (error && (error.stack || error.message)) || (String(message || '') + ' @ ' + String(source || '') + ':' + String(lineno || 0) + ':' + String(colno || 0)));
        if (typeof originalErrorHandler === 'function') {
          return originalErrorHandler.call(this, message, source, lineno, colno, error);
        }
        return false;
      };

      window.addEventListener('unhandledrejection', function (event) {
        if (isExtensionError('', '', event.reason)) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          return;
        }
        reportBootError('unhandledrejection', String((event.reason && (event.reason.stack || event.reason.message)) || event.reason || 'unknown rejection'));
      }, true);
    })();
  </script>
  <script>
    (function () {
      var host = window.location.hostname || "";
      var isLocalHost =
        host === "localhost" ||
        host === "127.0.0.1" ||
        host === "::1" ||
        /^10\./.test(host) ||
        /^192\.168\./.test(host) ||
        /^172\.(1[6-9]|2[0-9]|3[0-1])\./.test(host);
      if (!isLocalHost) return;
      if (!("serviceWorker" in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs || regs.length === 0) return;
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () { });
      if ("caches" in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { caches.delete(k); });
        }).catch(function () { });
      }
    })();
  </script>

  <script type="module" id="app-entry-script" src="/src/index.tsx"></script>
  <script>
    (function () {
      window.__entryScriptStatus = "pending";
      function show(title, detail) {
        if (typeof window.__reportBootError === 'function') {
          window.__reportBootError(title, detail);
          return;
        }
        try {
          if (document.getElementById('__html-boot-error__')) return;
          var box = document.createElement('div');
          box.id = '__html-boot-error__';
          box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:2147483647;background:#1a1a1a;color:#fff;padding:10px 12px;border:1px solid rgba(255,255,255,.2);font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:45vh;overflow:auto';
          box.textContent = String(title || 'Script error') + '\n' + String(detail || '');
          document.body.appendChild(box);
        } catch (_e) { }
      }

      var entry = document.getElementById('app-entry-script');
      /** entry 仍为 pending 时 #root 为空是正常的（慢网）；勿用固定 8s 报错误杀 */
      var VERIFY_AFTER_ENTRY_MS = 6000;
      var MAX_PENDING_BEFORE_HINT_MS = 120000;

      function describeSw() {
        return String(!!(navigator.serviceWorker && navigator.serviceWorker.controller));
      }

      if (entry) {
        entry.addEventListener('load', function () {
          window.__entryScriptStatus = "loaded";
          window.setTimeout(function verifyReactMounted() {
            var root = document.getElementById('root');
            if (!root || root.children.length > 0) return;
            var cover = document.getElementById('static-boot-cover');
            if (cover) cover.remove();
            show(
              'bootstrap-timeout',
              'Root is still empty after entry script ran\n(entry gave React time to mount: ' +
                VERIFY_AFTER_ENTRY_MS +
                'ms)\nserviceWorker.controller=' +
                describeSw()
            );
          }, VERIFY_AFTER_ENTRY_MS);
        }, true);
        entry.addEventListener('error', function () {
          window.__entryScriptStatus = "error";
          var cover = document.getElementById('static-boot-cover');
          if (cover) cover.remove();
          show('entry-script-error', 'Failed to load/execute module script graph');
        }, true);
      }

      window.setTimeout(function slowDownloadHint() {
        var root = document.getElementById('root');
        if (!root || root.children.length > 0) return;
        if (window.__entryScriptStatus !== "pending") return;
        show(
          'bootstrap-slow-network',
          'Application bundle still downloading after ' +
            MAX_PENDING_BEFORE_HINT_MS / 1000 +
            's\nentryStatus=pending — try faster network or disable throttling.\nserviceWorker.controller=' +
            describeSw()
        );
      }, MAX_PENDING_BEFORE_HINT_MS);
    })();
  </script>
