  <script>
    /* iOS ignores user-scalable=no — block pinch/gesture zoom as early as possible. */
    (function () {
      var content =
        "width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover";
      function lockMeta() {
        var meta = document.querySelector('meta[name="viewport"]');
        if (!meta) {
          meta = document.createElement("meta");
          meta.setAttribute("name", "viewport");
          document.head.appendChild(meta);
        }
        meta.setAttribute("content", content);
      }
      lockMeta();
      document.addEventListener(
        "touchmove",
        function (e) {
          if (e.touches && e.touches.length > 1) e.preventDefault();
        },
        { passive: false, capture: true }
      );
      function blockGesture(e) {
        e.preventDefault();
      }
      document.addEventListener("gesturestart", blockGesture, { passive: false, capture: true });
      document.addEventListener("gesturechange", blockGesture, { passive: false, capture: true });
      document.addEventListener("gestureend", blockGesture, { passive: false, capture: true });
      document.addEventListener(
        "wheel",
        function (e) {
          if (e.ctrlKey) e.preventDefault();
        },
        { passive: false, capture: true }
      );
      var lastTouchEnd = 0;
      document.addEventListener(
        "touchend",
        function (e) {
          var t = e.target;
          if (
            t &&
            t.closest &&
            t.closest("input, textarea, select, [contenteditable='true']")
          ) {
            lastTouchEnd = Date.now();
            return;
          }
          var now = Date.now();
          if (now - lastTouchEnd <= 320) e.preventDefault();
          lastTouchEnd = now;
        },
        { passive: false, capture: true }
      );
    })();
  </script>

  <!-- Legacy player URLs: /portal/* → /gc/*, /campaign/* → /cc/* -->
  <script>
    (function () {
      try {
        var p = location.pathname || "";
        var next = null;
        if (p === "/portal" || p.indexOf("/portal/") === 0) {
          next = "/gc" + p.slice("/portal".length);
        } else if (p === "/campaign" || p.indexOf("/campaign/") === 0) {
          next = "/cc" + p.slice("/campaign".length);
        }
        if (next) {
          history.replaceState(history.state, "", next + location.search + location.hash);
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <!-- CrazyGames CDN: rewrite /game/version/index.html → /gc entry before SPA boots -->
  <script>
    (function () {
      try {
        var h = (location.hostname || "").toLowerCase();
        var onCg =
          h === "crazygames.com" ||
          h.indexOf(".crazygames.com") !== -1 ||
          h.indexOf("game-files.crazygames.com") !== -1;
        if (!onCg) return;
        var p = location.pathname || "";
        if (
          p.indexOf("/gc/") === 0 ||
          p.indexOf("/casual/") === 0 ||
          p.indexOf("/tactical/") === 0 ||
          p.indexOf("/cc/") === 0
        ) {
          return;
        }
        var entry = "/gc/crazygames/solitaire";
        history.replaceState(history.state, "", entry + location.search + location.hash);
      } catch (e) { /* ignore */ }
    })();
  </script>

        partner: { "zh-CN": "正在加载 Partner 管理…", "en-US": "Loading partner admin…" },

      function resolveShellId(path) {
        if (path.indexOf("/platform") === 0) return "platform";
        if (path.indexOf("/partner/operation") === 0) return "partnerOperation";
        if (path.indexOf("/cc/merchant") === 0) return "partnerOperation";
        if (path.indexOf("/partner") === 0) return "partner";
        if (path.indexOf("/cc") === 0) return "campaign";
        if (path.indexOf("/gc") === 0) return "portal";
        if (path.indexOf("/tactical") === 0) return "tactical";
        if (path.indexOf("/casual") === 0) return "casual";
        return "portal";
      }
      function matchLocale(tag) {
        var lang = (tag || "").toLowerCase();
        if (lang.indexOf("zh") === 0) return "zh-CN";
        if (lang.indexOf("en") === 0) return "en-US";
        return null;
      }
      function detectBrowserLocale() {
        var candidates = [];
        if (navigator.languages && navigator.languages.length) {
          candidates = candidates.concat(Array.prototype.slice.call(navigator.languages));
        }
        if (navigator.language) candidates.push(navigator.language);
        for (var i = 0; i < candidates.length; i++) {
          var matched = matchLocale(candidates[i]);
          if (matched) return matched;
        }
        return "zh-CN";
      }
      function resolveLocale() {
        try {
          if (localStorage.getItem("app_locale_user_set") === "1") {
            var saved = localStorage.getItem("app_locale");
            if (saved === "zh-CN" || saved === "en-US") return saved;
          }
        } catch (e) {}
        return detectBrowserLocale();
      }
      var pathname = window.location.pathname;
      var shellId = resolveShellId(pathname);
      var theme = THEMES[shellId] || THEMES.portal;
      var locale = resolveLocale();
      var portrait = window.innerHeight > window.innerWidth;
      var fallback = portrait ? theme.fallbackP : theme.fallbackL;
      var gradient = portrait ? theme.gradP : theme.gradL;
      var photo = portrait ? theme.bgP : theme.bgL;
      var bgImage = photo ? 'url("' + photo + '"), ' + gradient : gradient;

      root.lang = locale;

      root.style.setProperty("--boot-bg-image", bgImage);

      root.style.setProperty("theme-color", fallback);
      window.__BOOT_SHELL_ID__ = shellId;
      window.__BOOT_BG_URL__ = photo || null;
      window.__BOOT_LABEL__ = (LABELS[shellId] || LABELS.portal)[locale] || LABELS.portal["zh-CN"];

  <script>
    (function () {
      'use strict';
      // 不覆盖 console.*：避免日志调用点被固定到本脚本行号。
      var SOURCE_MARKERS = [
        'chrome-extension://',
        'moz-extension://',
        'safari-web-extension://',
        'solanaActionsContentScript',
        'inpage.js',
        'contentScript',
        'injected'
      ];
      var MESSAGE_MARKERS = [
        'Failed to connect to MetaMask',
        'Failed to connect',
        'Something went wrong',
        'extension not found',
        'MetaMask',
        'wallet',
        'solana'
      ];

      function containsAny(text, markers) {
        if (!text) return false;
        for (var i = 0; i < markers.length; i++) {
          if (text.indexOf(markers[i]) !== -1) return true;
        }
        return false;
      }

      function isExtensionError(source, message, error) {
        var sourceStr = String(source || '');
        var messageStr = String(message || '');
        var stackStr = String((error && error.stack) || '');
        var nameStr = String((error && error.name) || '');
        var errorMsgStr = String((error && error.message) || '');
        var allText = sourceStr + ' ' + stackStr + ' ' + messageStr + ' ' + errorMsgStr + ' ' + nameStr;
        return containsAny(allText, SOURCE_MARKERS) || containsAny(allText, MESSAGE_MARKERS);
      }

      function reportBootError(title, detail) {
        try {
          if (document.getElementById('__html-boot-error__')) return;
          var box = document.createElement('div');
          box.id = '__html-boot-error__';
          box.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:2147483647;background:#1a1a1a;color:#fff;padding:10px 12px;border:1px solid rgba(255,255,255,.2);font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;max-height:45vh;overflow:auto';
          box.textContent = String(title || 'Script error') + '\n' + String(detail || '');
          document.body.appendChild(box);
        } catch (_e) { }
      }
      window.__reportBootError = reportBootError;

      var originalErrorHandler = window.onerror;
      window.onerror = function (message, source, lineno, colno, error) {
        if (isExtensionError(source, message, error)) return true;
        reportBootError('window.onerror', (error && (error.stack || error.message)) || (String(message || '') + ' @ ' + String(source || '') + ':' + String(lineno || 0) + ':' + String(colno || 0)));
        if (typeof originalErrorHandler === 'function') {
          return originalErrorHandler.call(this, message, source, lineno, colno, error);
        }
        return false;
      };

      window.addEventListener('unhandledrejection', function (event) {
        if (isExtensionError('', '', event.reason)) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          return;
        }
        reportBootError('unhandledrejection', String((event.reason && (event.reason.stack || event.reason.message)) || event.reason || 'unknown rejection'));
      }, true);
    })();
  </script>

                VERIFY_AFTER_ENTRY_MS +
                'ms)\nserviceWorker.controller=' +
                describeSw()
            );
          }, VERIFY_AFTER_ENTRY_MS);
        }, true);
        entry.addEventListener('error', function () {
          window.__entryScriptStatus = "error";
          var cover = document.getElementById('static-boot-cover');
          if (cover) cover.remove();
          show('entry-script-error', 'Failed to load/execute module script graph');
        }, true);
      }

      window.setTimeout(function slowDownloadHint() {
        var root = document.getElementById('root');
        if (!root || root.children.length > 0) return;
        if (window.__entryScriptStatus !== "pending") return;
        show(
          'bootstrap-slow-network',
          'Application bundle still downloading after ' +
            MAX_PENDING_BEFORE_HINT_MS / 1000 +
            's\nentryStatus=pending — try faster network or disable throttling.\nserviceWorker.controller=' +
            describeSw()
        );
      }, MAX_PENDING_BEFORE_HINT_MS);
    })();
  </script>
</body>

</html>
