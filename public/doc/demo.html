<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单人纸牌游戏演示</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            color: white;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            margin: 10px 0 0 0;
            font-size: 1.2em;
            opacity: 0.9;
        }

        .game-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-wrapper {
            width: 100%;
            max-width: 1200px;
            height: 80vh;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .instructions {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            color: white;
        }

        .instructions h3 {
            margin: 0 0 15px 0;
            font-size: 1.5em;
        }

        .instructions ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .instructions li {
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9em;
        }

        .keyboard-shortcuts {
            margin-top: 15px;
            font-size: 0.8em;
            opacity: 0.8;
        }

        .keyboard-shortcuts kbd {
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .header p {
                font-size: 1em;
            }

            .instructions ul {
                flex-direction: column;
                align-items: center;
            }

            .game-wrapper {
                height: 70vh;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🃏 单人纸牌游戏</h1>
        <p>基于 React + TypeScript 的经典纸牌游戏</p>
    </div>

    <div class="game-container">
        <div class="game-wrapper">
            <!-- 这里会渲染 React 组件 -->
            <div id="solo-game-root" style="width: 100%; height: 100%;">
                <div style="
                    display: flex; 
                    align-items: center; 
                    justify-content: center; 
                    height: 100%; 
                    background: #0d5f0d;
                    color: white;
                    font-size: 18px;
                ">
                    <div style="text-align: center;">
                        <div style="font-size: 48px; margin-bottom: 20px;">🃏</div>
                        <div>单人纸牌游戏</div>
                        <div style="font-size: 14px; margin-top: 10px; opacity: 0.8;">
                            请使用 React 组件进行集成
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="instructions">
        <h3>🎮 游戏说明</h3>
        <ul>
            <li>🎯 目标：将所有卡牌按花色移动到基础堆</li>
            <li>🖱️ 拖拽：点击并拖拽卡牌进行移动</li>
            <li>👆 双击：双击卡牌自动移动到合适位置</li>
            <li>🔄 翻牌：每列最后一张卡牌可以翻开</li>
        </ul>

        <div class="keyboard-shortcuts">
            <strong>键盘快捷键：</strong>
            <kbd>H</kbd> 获取提示 |
            <kbd>Ctrl+U</kbd> 撤销 |
            <kbd>Ctrl+A</kbd> 自动完成 |
            <kbd>Esc</kbd> 取消选择
        </div>
    </div>

    <script>
        // 这里可以添加一些演示用的 JavaScript 代码
        console.log('单人纸牌游戏演示页面已加载');

        // 模拟一些交互效果
        document.addEventListener('DOMContentLoaded', function () {
            const gameWrapper = document.querySelector('.game-wrapper');
            if (gameWrapper) {
                gameWrapper.addEventListener('mouseenter', function () {
                    this.style.transform = 'scale(1.02)';
                    this.style.transition = 'transform 0.3s ease';
                });

                gameWrapper.addEventListener('mouseleave', function () {
                    this.style.transform = 'scale(1)';
                });
            }
        });
    </script>
</body>

</html>
